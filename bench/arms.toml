# Server arms for the serving benchmark; see bench/README.md.
#
# Each arm inherits [defaults]. An arm's `args` override the default flags, and
# `--set flag=value` / `--unset flag` on the command line override both. Flags
# are sglang.launch_server flags without the leading dashes; `true` adds a bare
# flag and `false` removes one. `max_concurrency` is the highest client
# concurrency the sweep will offer; the launcher refuses a server whose
# effective max_running_requests is lower. Required per-arm key:
#   exactness = "stock" | "exact-up-to-floor" | "pending" | "lossy"
#                   how the arm's greedy outputs relate to plain decoding with the
#                   default flags (bench/arms.py says what each class means).
#                   A stock arm may only set flags in NEUTRAL_FLAGS
#                   (bench/arms.py) and FlashInfer target attention; anything
#                   else makes an arm pending until its outputs are classified
#                   (bench/campaigns/equality_tuned.sh).
# Optional per-arm keys:
#   lossy = "..."   what the arm changes numerically (FP8 weights, FP8 KV, BF16
#                   GDN state, ...); required unless the class is stock. Lossy
#                   arms need a quality measurement.
#   require_full_graph_coverage = false   allow capacity above the largest
#                   decode/verify CUDA graph (large batches then run eagerly).

[defaults]
model = "Qwen/Qwen3.5-4B"
revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
max_concurrency = 128

[defaults.args]
# No FA3 on aarch64 (SETUP.md).
attention-backend = "flashinfer"
mm-attention-backend = "triton_attn"
# Server capacity is fixed at the top client concurrency for every arm. The
# GDN state cache, not the KV cache, bounds capacity for this model: each
# running request reserves 5 state slots (radix cache with the extra_buffer
# strategy under the overlap scheduler). 640 slots admit exactly 128 requests
# and leave the rest of the static pool to the KV cache and, with speculation,
# to the per-draft-token intermediate states. At the default split, MTP with
# three steps is capped at 72 requests. The static fraction is raised from the
# automatic 0.815 so a 5-step chain (6 intermediate states per request) also
# fits at 128; about 6 GB stays free for activations after graph capture.
max-running-requests = 128
max-mamba-cache-size = 640
mem-fraction-static = 0.85
# Cap the KV cache at 1M tokens (a full batch of 128 at 7.8K tokens each, well
# above the sweeps' ~600 and the quality runs' mean ~5.4K). Without a cap, a
# configuration that needs little state memory (radix cache off, buffered verify)
# hands ~2M tokens to the target KV cache, SGLang then allocates the draft's KV for
# the same token count outside the static pool, and prefill runs out of memory.
max-total-tokens = 1000000
# /metrics: token, verify-call and CUDA-graph pass counters per sweep point.
enable-metrics = true
random-seed = 0
# Stream every 4 tokens (the first token is still sent at once). With one-token
# chunks the tokenizer-manager process saturates one core near 16K chunks/s and
# caps plain decoding at high concurrency: at c=256 on a quiet host the client
# saw 15.4K tok/s against 18.0K of server-side decode; with an interval of 4 the
# process drops to 0.35 cores and the client sees 16.5K, the same as a
# non-streaming client (evidence/bench/frontend/). TTFT and the last-chunk time
# that define x and y are unchanged; only chunk granularity is coarser.
stream-interval = 4

[arms.plain]
description = "Arm A: ordinary autoregressive decoding (no speculation)."
exactness = "stock"

[arms.mtp]
description = """Arm B, untuned starting point: native MTP (the checkpoint's one \
MTP layer, loaded implicitly) with the SGLang cookbook's Qwen3.5 settings, a \
three-step chain with one draft per step."""
exactness = "stock"

[arms.mtp.args]
speculative-algorithm = "NEXTN"
speculative-num-steps = 3
speculative-eagle-topk = 1
speculative-num-draft-tokens = 4

# DFlash block drafter (z-lab/Qwen3.5-4B-DFlash, Apache-2.0): a 6-layer draft
# conditioned on eight target layers that proposes a whole block per pass. Only
# algorithm flags live here; backend and runtime flags are shared by every arm
# (chosen once on the tuning split). The model card's other B200 flags are
# ablations, not part of the arm: trtllm_mha target attention (Blackwell only),
# flashinfer GDN kernels and SGLANG_ENABLE_OVERLAP_PLAN_STREAM (tested on every
# arm), tc_piecewise prefill graphs (torch.compile fails on Qwen3.5's residual
# stream at bd66ce34), and --mamba-scheduler-strategy (named
# --mamba-radix-cache-strategy here; already resolves to extra_buffer).
[arms.dflash]
description = """DFlash block drafter, block size 8 (the model card's serving \
default)."""
exactness = "stock"

[arms.dflash.args]
speculative-algorithm = "DFLASH"
speculative-draft-model-path = "z-lab/Qwen3.5-4B-DFlash"
speculative-draft-model-revision = "9a1996ccf887b79ab3af4fcbf8c1d1f4b5658bcf"
speculative-dflash-block-size = 8

# ---------------------------------------------------------------------------
# Tuned arms (chosen on the tune split; evidence/bench/tuning/). All run without
# the radix cache: this workload has no prefix reuse, and it frees the GDN state
# memory that deeper drafts and buffered verify need at capacity 128. Each
# speculative family has a Triton-attention arm for low concurrency, where
# Triton is faster for speculative verify, and a FlashInfer arm for high
# concurrency; plain decoding is indifferent to the backend (both measured), and
# its Triton arm is the matched baseline for the Triton speculative arms.
# ---------------------------------------------------------------------------

[arms.plain-tuned]
description = "Arm A, tuned: plain decoding, radix cache off, FlashInfer attention."
exactness = "stock"
[arms.plain-tuned.args]
disable-radix-cache = true
max-mamba-cache-size = 128

[arms.plain-tuned-triton]
description = "Arm A, tuned, Triton attention: matched baseline for Triton speculative arms."
exactness = "pending"
lossy = "pending: Triton target attention; greedy outputs classified against plain (bench/campaigns/equality_tuned.sh)"
[arms.plain-tuned-triton.args]
disable-radix-cache = true
max-mamba-cache-size = 128
attention-backend = "triton"

[arms.plain-tuned-replayssm]
description = """Arm A with SGLang's buffered GDN decode (ReplaySSM ring, full state \
flushed every 16 tokens): faster at high concurrency, slower at low."""
exactness = "pending"
lossy = "pending: buffered GDN decode; greedy outputs classified against plain (bench/campaigns/equality_tuned.sh)"
[arms.plain-tuned-replayssm.args]
disable-radix-cache = true
max-mamba-cache-size = 128
enable-linear-replayssm = true

[arms.mtp-tuned]
description = """Arm B, tuned for high concurrency: native MTP, 3-step chain, buffered \
GDN verify (no per-draft-token state snapshots), FlashInfer attention."""
exactness = "pending"
lossy = "pending: buffered GDN verify; greedy outputs classified against plain (bench/campaigns/equality_tuned.sh)"
[arms.mtp-tuned.args]
speculative-algorithm = "NEXTN"
speculative-num-steps = 3
speculative-eagle-topk = 1
speculative-num-draft-tokens = 4
enable-linear-replayssm-spec = true
disable-radix-cache = true
max-mamba-cache-size = 128

[arms.mtp-tuned-triton]
description = "Arm B, tuned for low concurrency: as mtp-tuned with Triton attention."
exactness = "pending"
lossy = "pending: buffered GDN verify and Triton target attention; greedy outputs classified against plain (bench/campaigns/equality_tuned.sh)"
[arms.mtp-tuned-triton.args]
speculative-algorithm = "NEXTN"
speculative-num-steps = 3
speculative-eagle-topk = 1
speculative-num-draft-tokens = 4
enable-linear-replayssm-spec = true
disable-radix-cache = true
max-mamba-cache-size = 128
attention-backend = "triton"

[arms.mtp-stockverify]
description = """Arm B with SGLang's stock (snapshot) GDN verify: the exact-stack MTP \
denominator if buffered verify does not classify as rounding-level."""
exactness = "stock"
[arms.mtp-stockverify.args]
speculative-algorithm = "NEXTN"
speculative-num-steps = 3
speculative-eagle-topk = 1
speculative-num-draft-tokens = 4
disable-radix-cache = true
max-mamba-cache-size = 128

[arms.dflash-tuned]
description = """Arm C, tuned: DFlash block 8 with FA4 draft attention (runs on sm_90 \
and was faster at every concurrency), FlashInfer target attention, capacity 128."""
exactness = "stock"
[arms.dflash-tuned.args]
speculative-algorithm = "DFLASH"
speculative-draft-model-path = "z-lab/Qwen3.5-4B-DFlash"
speculative-draft-model-revision = "9a1996ccf887b79ab3af4fcbf8c1d1f4b5658bcf"
speculative-dflash-block-size = 8
speculative-draft-attention-backend = "fa4"
disable-radix-cache = true
max-mamba-cache-size = 128

[arms.dflash-tuned-b16]
description = """Arm C for low concurrency: DFlash block 16, Triton attention. Its 16 \
GDN verify states per request (~0.8 GB) cap capacity at 64."""
max_concurrency = 64
exactness = "pending"
lossy = "pending: Triton target attention; greedy outputs classified against plain (bench/campaigns/equality_tuned.sh)"
[arms.dflash-tuned-b16.args]
speculative-algorithm = "DFLASH"
speculative-draft-model-path = "z-lab/Qwen3.5-4B-DFlash"
speculative-draft-model-revision = "9a1996ccf887b79ab3af4fcbf8c1d1f4b5658bcf"
speculative-dflash-block-size = 16
disable-radix-cache = true
max-mamba-cache-size = 64
max-running-requests = 64
attention-backend = "triton"

[arms.dflash-tuned-b4]
description = """Arm C for high concurrency: DFlash block 4, FlashInfer attention. On the \
tune split it beat block 8 by 8% at c=128 (11,477 against 10,594 tok/s) and lost \
at c<=32 (c=64 not measured)."""
exactness = "stock"
[arms.dflash-tuned-b4.args]
speculative-algorithm = "DFLASH"
speculative-draft-model-path = "z-lab/Qwen3.5-4B-DFlash"
speculative-draft-model-revision = "9a1996ccf887b79ab3af4fcbf8c1d1f4b5658bcf"
speculative-dflash-block-size = 4
disable-radix-cache = true
max-mamba-cache-size = 128
